name: Probe sources

# Fetches sample answers from search sources so their formats can be checked from
# environments that cannot reach them. Results land on the "probe" pre-release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/probe.py]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/probe.py || true
          cat out/summary.txt
          cd out && tar czf ../probe-sources.tgz *.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view probe >/dev/null 2>&1 || \
            gh release create probe --prerelease --latest=false --title "Служебное" --notes "Служебные отчёты сборки, не для установки."
          gh release upload probe probe-sources.tgz --clobber
